<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <!-- Etapa 11 — Conectando o CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Etapa 13 — Cartão do formulário -->
    <div class="container">
        <h1>Cadastro de Usuário</h1>
        
        <form>
            <!-- Etapa 3 — Nome e Sobrenome -->
            <div class="grupo-campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
            </div>

            <div class="grupo-campo">
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" name="sobrenome" required placeholder="Digite seu sobrenome">
            </div>

            <!-- Etapa 4 — E-mail -->
            <div class="grupo-campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
            </div>

            <!-- Etapa 5 — Senha -->
            <div class="grupo-campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required placeholder="Crie uma senha forte">
            </div>

            <!-- Etapa 18 (Desafio) — Telefone -->
            <div class="grupo-campo">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(41) 99999-9999">
            </div>

            <!-- Etapa 6 — Data de nascimento -->
            <div class="grupo-campo">
                <label for="data">Data de Nascimento:</label>
                <input type="date" id="data" name="data">
            </div>

            <!-- Etapa 7 — Radio buttons (Gênero) -->
            <div class="grupo-campo">
                <p class="label-genero">Gênero:</p>
                <div class="opcoes-inline">
                    <input type="radio" id="masculino" name="sexo" value="masculino">
                    <label for="masculino">Masculino</label>

                    <input type="radio" id="feminino" name="sexo" value="feminino">
                    <label for="feminino">Feminino</label>

                    <input type="radio" id="outro" name="sexo" value="outro">
                    <label for="outro">Outro</label>
                </div>
            </div>

            <!-- Etapa 8 — Lista de cidades -->
            <div class="grupo-campo">
                <label for="cidade">Cidade:</label>
                <select id="cidade" name="cidade">
                    <option value="">Selecione uma cidade</option>
                    <option value="curitiba">Curitiba</option>
                    <option value="londrina">Londrina</option>
                    <option value="maringa">Maringá</option>
                    <option value="ponta-grossa">Ponta Grossa</option>
                </select>
            </div>
            <!-- Etapa EXTRA - lista de estado -->
            <div class="grupo-campo"> 
                <label for="estado">Estado:</label>
                <select id="cidade" name="cidade">
                    <option value="">Selecione uma Estado</option>
                    <option value="paraná">Paraná</option>
                    <option value="santa catarina">Santa Catarina</option>
                    <option value="rio grande do sul ">Rio Grande do Sul </option>
                    <option value="são paulo">São Paulo</option>
                </select>





            </div>
            <!-- Etapa 18 (Desafio) — Aceite dos termos -->
            <div class="grupo-campo campo-termos">
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Li e aceito os <a href="#">termos de uso</a></label>
            </div>

            <!-- Etapa 10 — Botão de cadastro -->
            <button type="submit">Cadastrar</button>
        </form>
    </div>

</body>
</html>
